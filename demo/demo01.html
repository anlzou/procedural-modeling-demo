<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3D + Three.js 交互展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a0a; font-family: 'Inter', sans-serif; }
        
        /* ====== CSS 3D 产品卡片模型 ====== */
        .product-card {
            width: 300px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            /* 初始动画由 GSAP 控制，这里只定义基础样式 */
        }
        
        /* 6个面 */
        .face {
            position: absolute;
            width: 300px;
            height: 400px;
            backface-visibility: visible;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* 前面 - 主展示 */
        .face-front {
            transform: translateZ(20px);
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 
                inset 0 1px 0 rgba(255,255,255,0.2),
                0 20px 40px rgba(0,0,0,0.4);
        }
        
        .face-front::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, 
                rgba(100,200,255,0.3) 0%, 
                transparent 50%, 
                rgba(255,100,200,0.3) 100%);
            pointer-events: none;
        }
        
        /* 后面 */
        .face-back {
            transform: rotateY(180deg) translateZ(20px);
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.3);
        }
        
        /* 4个侧面 */
        .face-right {
            width: 40px;
            height: 400px;
            transform: rotateY(90deg) translateZ(280px);
            background: linear-gradient(to bottom, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        }
        .face-left {
            width: 40px;
            height: 400px;
            transform: rotateY(-90deg) translateZ(20px);
            background: linear-gradient(to bottom, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        }
        .face-top {
            width: 300px;
            height: 40px;
            transform: rotateX(90deg) translateZ(20px);
            background: rgba(255,255,255,0.1);
        }
        .face-bottom {
            width: 300px;
            height: 40px;
            transform: rotateX(-90deg) translateZ(380px);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        
        /* 内容样式 */
        .product-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .product-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }
        .product-price {
            font-size: 36px;
            font-weight: 900;
            color: #64c8ff;
            text-shadow: 0 0 20px rgba(100,200,255,0.5);
        }
        .buy-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #64c8ff, #ff64c8);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(100,200,255,0.4);
        }
        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(100,200,255,0.6);
        }
        
        /* 装饰元素 - 纯 CSS 3D */
        .orbit-ring {
            position: absolute;
            width: 500px;
            height: 500px;
            border: 2px solid rgba(100,200,255,0.2);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotateX(70deg);
            animation: orbit 10s linear infinite;
        }
        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg); }
        }
        
        /* 粒子效果 */
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: #64c8ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #64c8ff;
        }
    </style>
</head>
<body>

<!-- Three.js 容器 -->
<div id="container"></div>

<!-- CSS3D 元素（会被 Three.js 捕获） -->
<div id="css3d-content" style="display:none;">
    <div class="product-card" id="card1">
        <div class="face face-front">
            <div>
                <div class="product-title">Pro X1</div>
                <div class="product-desc">下一代智能设备，融合前沿科技与极简美学</div>
            </div>
            <div>
                <div class="product-price">¥2,999</div>
                <button class="buy-btn">立即购买</button>
            </div>
        </div>
        <div class="face face-back">PRO X1</div>
        <div class="face face-right"></div>
        <div class="face face-left"></div>
        <div class="face face-top"></div>
        <div class="face face-bottom"></div>
        <div class="orbit-ring"></div>
    </div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ====== 1. 场景设置 ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

// 双渲染器：WebGL + CSS3D
const webglRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
webglRenderer.setSize(window.innerWidth, window.innerHeight);
webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
webglRenderer.domElement.style.position = 'absolute';
webglRenderer.domElement.style.top = '0';
webglRenderer.domElement.style.pointerEvents = 'none'; // 让事件穿透到 CSS 层
document.getElementById('container').appendChild(webglRenderer.domElement);

const css3dRenderer = new CSS3DRenderer();
css3dRenderer.setSize(window.innerWidth, window.innerHeight);
css3dRenderer.domElement.style.position = 'absolute';
css3dRenderer.domElement.style.top = '0';
css3dRenderer.domElement.style.pointerEvents = 'auto';
document.getElementById('container').appendChild(css3dRenderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 5000);
camera.position.set(0, 0, 800);

const controls = new OrbitControls(camera, css3dRenderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// ====== 2. 创建 CSS3D 对象 ======
const cardElement = document.querySelector('.product-card');
const css3dObject = new CSS3DObject(cardElement);
css3dObject.position.set(0, 0, 0);
css3dObject.scale.set(0.5, 0.5, 0.5); // 缩放以适应场景
scene.add(css3dObject);

// ====== 3. WebGL 背景层（粒子 + 光效） ======
// 粒子系统
const particleCount = 200;
const positions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
    positions[i] = (Math.random() - 0.5) * 2000;
    positions[i+1] = (Math.random() - 0.5) * 2000;
    positions[i+2] = (Math.random() - 0.5) * 1000;
}
const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
    color: 0x64c8ff,
    size: 3,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// 环境光 + 点光源
const ambientLight = new THREE.AmbientLight(0x404040, 2);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x64c8ff, 2, 1000);
pointLight.position.set(200, 200, 200);
scene.add(pointLight);

const pointLight2 = new THREE.PointLight(0xff64c8, 2, 1000);
pointLight2.position.set(-200, -200, 200);
scene.add(pointLight2);

// ====== 4. 后期处理（Bloom 辉光） ======
const composer = new EffectComposer(webglRenderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.5, 0.4, 0.85
);
composer.addPass(bloomPass);

// ====== 5. 交互逻辑 ======
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = false;

// 鼠标移动：卡片跟随倾斜
document.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    
    // CSS3D 卡片倾斜效果
    const tiltX = mouse.y * 15; // 绕 X 轴
    const tiltY = mouse.x * 15; // 绕 Y 轴
    
    // 使用 GSAP 平滑过渡（如未引入可用原生）
    cardElement.style.transform = `
        rotateX(${-tiltX}deg) 
        rotateY(${tiltY}deg)
    `;
    
    // 粒子跟随鼠标
    pointLight.position.x = mouse.x * 500;
    pointLight.position.y = mouse.y * 500;
});

// 点击交互
document.addEventListener('click', () => {
    // 卡片翻转动画
    const currentRot = css3dObject.rotation.y;
    const targetRot = currentRot + Math.PI;
    
    // 简单动画循环
    let progress = 0;
    function flip() {
        progress += 0.05;
        if (progress <= 1) {
            css3dObject.rotation.y = currentRot + (targetRot - currentRot) * easeOutCubic(progress);
            requestAnimationFrame(flip);
        }
    }
    flip();
});

function easeOutCubic(x) {
    return 1 - Math.pow(1 - x, 3);
}

// ====== 6. 动画循环 ======
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    
    controls.update();
    
    // 粒子旋转
    particles.rotation.y = time * 0.05;
    particles.rotation.x = time * 0.02;
    
    // CSS3D 悬浮动画
    css3dObject.position.y = Math.sin(time) * 20;
    
    // 光效脉冲
    pointLight.intensity = 2 + Math.sin(time * 2) * 0.5;
    
    // 双渲染器渲染
    webglRenderer.render(scene, camera);
    css3dRenderer.render(scene, camera);
}

animate();

// 窗口调整
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    webglRenderer.setSize(window.innerWidth, window.innerHeight);
    css3dRenderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
